version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: health-nutrition-api
    container_name: health-nutrition-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - health-network

  webserver:
    image: nginx:alpine
    container_name: health-nutrition-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - health-network

  db:
    image: mysql:8.0
    container_name: health-nutrition-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "33061:3306"
    networks:
      - health-network

networks:
  health-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
